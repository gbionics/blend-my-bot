name: Blender extension

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  extension:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download Blender 4.2 LTS
        run: |
          curl --fail --location --output blender.tar.xz \
            https://download.blender.org/release/Blender4.2/blender-4.2.9-linux-x64.tar.xz
          echo "dfbc127a7d28f9c2175b23bf9d6701b2855f31eedfb391f9a6e60adb24572846  blender.tar.xz" | sha256sum --check
          tar -xf blender.tar.xz
          echo "$PWD/blender-4.2.9-linux-x64" >> "$GITHUB_PATH"
      - name: Test path resolution
        run: |
          python -m pip install resolve-robotics-uri-py==0.5.1
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Build self-contained extension
        run: python tools/build_extension.py
      - name: Test installation and robot import
        env:
          BLENDER_USER_RESOURCES: ${{ runner.temp }}/blend-my-bot-profile
        run: |
          blender --background --factory-startup --python-exit-code 1 \
            --python tests/blender_smoke.py -- \
            dist/blend_my_bot-0.1.0-blender-4.2-linux-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: blend-my-bot-blender-4.2-linux-x64
          path: dist/*.zip
          if-no-files-found: error
