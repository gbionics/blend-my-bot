name: Blender extension

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  extension:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download Blender 5.0
        run: |
          curl --fail --location --output blender.tar.xz \
            https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  blender.tar.xz" | sha256sum --check
          tar -xf blender.tar.xz
          echo "$PWD/blender-5.0.1-linux-x64" >> "$GITHUB_PATH"
      - name: Test paths, discovery, motion format and online catalog
        run: |
          python -m pip install resolve-robotics-uri-py==0.5.1 numpy==1.26.4 robot_descriptions==3.2.0 pycollada==0.9.3
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Build self-contained extension
        run: python tools/build_extension.py
      - name: Test installation, robot imports and motion loading
        env:
          BLENDER_USER_RESOURCES: ${{ runner.temp }}/blend-my-bot-profile
        run: |
          blender --background --factory-startup --python-exit-code 1 \
            --python tests/blender_smoke.py -- \
            dist/blend_my_bot-0.1.0-blender-5.0-linux-x64.zip
          blender --background --factory-startup --python-exit-code 1 \
            --python tests/blender_motion.py -- \
            dist/blend_my_bot-0.1.0-blender-5.0-linux-x64.zip
          blender --background --factory-startup --python-exit-code 1 \
            --python tests/blender_online.py -- \
            dist/blend_my_bot-0.1.0-blender-5.0-linux-x64.zip
          blender --background --factory-startup --python-exit-code 1 \
            --python tests/blender_collada.py -- \
            dist/blend_my_bot-0.1.0-blender-5.0-linux-x64.zip
          blender --background --factory-startup --python-exit-code 1 \
            --python tests/blender_materials.py -- \
            dist/blend_my_bot-0.1.0-blender-5.0-linux-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: blend-my-bot-blender-5.0-linux-x64
          path: dist/*.zip
          if-no-files-found: error
