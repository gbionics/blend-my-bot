[metadata]
name = blend-my-bot
description = A package to import URDF files into Blender
long_description = file: README.md
long_description_content_type = text/markdown
author = "Giuseppe L'Erario"
author_email = gl.giuseppelerario@gmail.com
license_files = LICENSE

keywords =
    robotics
    blender
    animation

[options]
packages = find:
package_dir =
        = src
python_requires = >=3.10
install_requires =
        idyntree
        numpy
        scipy>=1.14
        resolve-robotics-uri-py>=0.5.1
        pycollada==0.9.3

[options.extras_require]
standalone =
        bpy>=5.0
catalog =
        robot_descriptions==3.2.0

[options.packages.find]
where = src
